  <path d="M715 625 V770" class="line-bi"/>
  <polygon points="715,625 705,641 725,641" class="arrowhead"/>
  <polygon points="715,770 705,754 725,754" class="arrowhead"/>
  <text x="735" y="705" class="edge-label">6  TL Get / data</text>

  <path d="M1065 625 V770" class="line-bi"/>
  <polygon points="1065,625 1055,641 1075,641" class="arrowhead"/>
  <polygon points="1065,770 1055,754 1075,754" class="arrowhead"/>
  <text x="1085" y="705" class="edge-label">6  TL Get / data</text>

  <rect x="1530" y="150" width="245" height="660" class="flow-box"/>
  <text x="1652" y="195" text-anchor="middle" class="flow-title">Automatic flow</text>

  <circle cx="1570" cy="230" r="18" class="step"/>
  <text x="1570" y="236" text-anchor="middle" class="step-text">1</text>
  <text x="1605" y="236" class="flow">Arm output range</text>

  <circle cx="1570" cy="300" r="18" class="step"/>
  <text x="1570" y="306" text-anchor="middle" class="step-text">2</text>
  <text x="1605" y="295" class="flow">Configure CGRA</text>
  <text x="1605" y="320" class="flow">and queue launch</text>

  <circle cx="1570" cy="380" r="18" class="step"/>
  <text x="1570" y="386" text-anchor="middle" class="step-text">3</text>
  <text x="1605" y="386" class="flow">Submit Gemmini</text>

  <circle cx="1570" cy="450" r="18" class="step"/>
  <text x="1570" y="456" text-anchor="middle" class="step-text">4</text>
  <text x="1605" y="445" class="flow">Report output</text>
  <text x="1605" y="470" class="flow">ready</text>

  <circle cx="1570" cy="530" r="18" class="step"/>
  <text x="1570" y="536" text-anchor="middle" class="step-text">5</text>
  <text x="1605" y="536" class="flow">Send copy request</text>

  <circle cx="1570" cy="600" r="18" class="step"/>
  <text x="1570" y="606" text-anchor="middle" class="step-text">6</text>
  <text x="1605" y="595" class="flow">Transfer through</text>
  <text x="1605" y="620" class="flow">TileLink</text>

  <circle cx="1570" cy="680" r="18" class="step"/>
  <text x="1570" y="686" text-anchor="middle" class="step-text">7</text>
  <text x="1605" y="686" class="flow">Launch CGRA</text>

  <circle cx="1570" cy="750" r="18" class="step"/>
  <text x="1570" y="756" text-anchor="middle" class="step-text">8</text>
  <text x="1605" y="756" class="flow">Read final result</text>

