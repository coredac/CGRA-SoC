<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 1800 1480" role="img" aria-labelledby="title desc">
  <title id="title">Gemmini and CGRA AutoLink architecture</title>
  <desc id="desc">The CPU configures Gemmini and CGRA. AutoLink connects the Gemmini and CGRA adapters. The CGRA DMA reads the four-bank Gemmini external SPM through the TileLink system bus, fills the CGRA SPM, and starts the CGRA.</desc>
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .group-title { font-family: Arial, sans-serif; font-size: 27px; font-weight: 500; fill: #111111; }
      .module { font-family: Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #111111; }
      .label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #111111; }
      .edge-label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #111111; }
      .flow-title { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #111111; }
      .flow { font-family: Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #111111; }
      .soc { fill: #f5f5f5; stroke: #666666; stroke-width: 4; }
      .ip { fill: #dce9f8; stroke: #7093c3; stroke-width: 4; }
      .block { fill: #ffe4c4; stroke: #d79700; stroke-width: 4; }
      .fabric { fill: #dcefd7; stroke: #82b66b; stroke-width: 4; }
      .cpu-box { fill: #f5f5f5; stroke: #666666; stroke-width: 4; }
      .flow-box { fill: #ffffff; stroke: #777777; stroke-width: 3; }
      .label-bg { fill: #f5f5f5; stroke: none; }
      .line { fill: none; stroke: #111111; stroke-width: 3; }
      .line-bi { fill: none; stroke: #111111; stroke-width: 3; }
      .event { fill: none; stroke: #111111; stroke-width: 3; stroke-dasharray: 8 6; }
      .manual-line { fill: none; stroke: #a46700; stroke-width: 4; }
      .arrowhead { fill: #111111; stroke: none; }
      .manual-head { fill: #a46700; stroke: none; }
      .step { fill: #555555; stroke: none; }
      .step-text { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1480" fill="#ffffff"/>

