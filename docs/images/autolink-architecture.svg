  <polygon points="1310,435 1304,427 1316,427" class="arrowhead"/>
  <text x="1328" y="430" class="edge-label">7  launch / done</text>

  <path d="M1200 390 H1185 V470 H1100 V500" class="line-bi"/>
  <polygon points="1200,390 1192,384 1192,396" class="arrowhead"/>
  <polygon points="1100,500 1094,492 1106,492" class="arrowhead"/>
  <text x="950" y="445" class="edge-label">5  DMA cmd / 6  done</text>

  <path d="M1170 585 H1200" class="line-bi"/>
  <polygon points="1170,585 1178,579 1178,591" class="arrowhead"/>
  <polygon points="1200,585 1192,579 1192,591" class="arrowhead"/>
