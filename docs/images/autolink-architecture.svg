  <rect x="610" y="315" width="210" height="95" class="block"/>
  <text x="715" y="355" text-anchor="middle" class="module">GemminiLink</text>
  <text x="715" y="385" text-anchor="middle" class="module">Adapter</text>

  <rect x="610" y="500" width="210" height="125" class="block"/>
  <text x="715" y="550" text-anchor="middle" class="module">External SPM</text>
