  <text x="1295" y="1190" text-anchor="middle" class="module">CGRA Core</text>

  <rect x="1470" y="1140" width="220" height="85" class="fabric"/>
  <text x="1580" y="1190" text-anchor="middle" class="module">CGRA DMA</text>

  <rect x="1330" y="1255" width="220" height="75" class="block"/>
  <text x="1440" y="1302" text-anchor="middle" class="module">CGRA SPM</text>

  <rect x="575" y="1365" width="1115" height="60" class="fabric"/>
  <text x="1132" y="1403" text-anchor="middle" class="module">TileLink System Bus</text>

