interface:
  num_tile_inports: 4
  num_tile_outports: 4
  num_fu_inports: 4
  num_fu_outports: 2
  data_nbits: 32
  predicate_nbits: 1
memory:
  data_mem_size_global: 32768
  data_mem_size_per_bank: 4096
  num_banks_per_cgra: 8
  num_registers_per_reg_bank: 8
  mem_access_is_combinational: false
  gemmini_external_spm:
    base_address: 0x60000000
    size_bytes: 131072
  cgra_spm_window:
    base_address: 0x60020000
    size_bytes: 131072
execution:
  ctrl_count_bits: 16
  context_switch: false
  global_reduce: false
communication:
  instances:
    gemmini0:
      type: gemmini
      dim: 64
      acc_kib: 32
      command_capacity: 144
      patch_capacity: 32
    cgra0:
      type: cgra
      packed_words: 32768
      packet_capacity: 192
  run_capacity: 32
  capacity:
    stages: 3
    dependencies: 3
    results: 512
    jobs:
      gemmini0: 64
      cgra0: 32
  buffer_slots:
    gemmini0: 2
    cgra0: 1
  stages:
    - name: scores
      endpoint: gemmini0
    - name: softmax
      endpoint: cgra0
      jobs: 3
    - name: values
      endpoint: gemmini0
  dependencies:
    - source: input_ready
      destination: scores
    - source: scores
      destination: softmax
      source_offset: 24576
      size_bytes: 4096
    - source: softmax
      destination: values
      size_bytes: 1024
      format: int8
