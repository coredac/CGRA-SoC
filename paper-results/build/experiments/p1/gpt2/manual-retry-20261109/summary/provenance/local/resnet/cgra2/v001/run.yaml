capacity_reasons:
  memory: Four groups retain four 1024-word outputs per device after 4096 scratch words, requiring exactly 8192 physical words. This replaces the one-CGRA 16384-word geometry and requires matching RTL-derived layout before firmware compilation.
  gemmini_memory: Native Conv requires 30976 bytes within its reserved lower half, so the existing 65536-byte power-of-two SPM remains necessary; both lanes reserve 8192 publication bytes in the upper half.
  gemmini_slots: Preserve the existing conservative bound of two slots per active lane. Hybrid Projection0 and Projection1 can each retain one publication while a main path needs another slot. First and Second do not retain publications simultaneously within a lane because Second waits for Activate and CGRA consumes First on copy completion. Four slots cover the two projections and two main paths.
  auto_slots: Rotated Auto Projection and Second have no data readers within their producing profile; fixed payload addresses survive slot release until the next profile's explicit root copies. Current First may overlap previous Add, whose completion protects current Projection and Second writes on each lane. The common hardware must also support Hybrid, so it retains four native slots.
  cgra_slots: Two per device allow previous Add input preparation while current Activate output remains live until Second finishes reading it.
  jobs: Eight strips reserve three native jobs each, while four groups reserve ReLU and Add on each CGRA.
  profiles: Hybrid captures four group profiles; Auto captures initial core, three middle core-plus-previous-Add profiles and final Add, for five profiles.
  graph: Hybrid peaks at ten stages and twelve edges; middle Auto profiles peak at ten stages and fourteen edges, including both publication-reuse completion dependencies per lane.
  reports: Ten results hold the largest profile's complete report set; software concurrently drains all forty reports across the large run.
  native_patches: Existing native Gemmini cache parameter requires a power of two greater than one; this source captures zero field patches.
  source_capacity_check: p1.c does not enforce a minimum slot count; the four-slot choice follows source graph ownership and the established design.yaml bound.
