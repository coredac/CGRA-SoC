hardware_delta:
  run_capacity: {before: 8, after: 9}
  dependency_capacity: {before: 6, after: 7}
  reason: Eight strips require nine rotated profiles; the seventh edge explicitly protects the previous second publication from overwrite.
  other_resources: Architecture, CGRA memories and controls, Gemmini native resources, job caches, stage capacity, result FIFO and slot counts match v001.
  comparison: Regenerate and rebuild v002 once, then run Manual, Hybrid and Auto on that same simulator. Do not compare a v002 Auto measurement against v001 baselines as a same-hardware result.
protocol:
  shapes: {small: [8, 8, 4, 4, 4, 8], large: [32, 32, 16, 16, 16, 32]}
  grouping: One homogeneous CGRA; unchanged two-row full-width strips.
  manual_hybrid: Native commands, arithmetic, operand bindings, profile boundaries and timing scopes are unchanged.
  auto: Move each Add to the following group's profile; execute one cached sequence with an initial core profile, middle core-plus-previous-Add profiles, and a final Add profile.
  profiles:
    formula: GROUPS + 1, where GROUPS = ceil(STRIPS / P1_CGRAS).
    small: {strips: 2, groups: 2, hybrid: 2, auto: 3, auto_stage_counts: [4, 5, 1], auto_edge_counts: [4, 7, 2]}
    large: {strips: 8, groups: 8, hybrid: 8, auto: 9, auto_stage_counts: [4, 5, 5, 5, 5, 5, 5, 5, 1], auto_edge_counts: [4, 7, 7, 7, 7, 7, 7, 7, 2]}
    launch_count: One Auto launch; no CPU-issued final singleton.
  reports: Ten small and forty large stage reports; CPU drains concurrently through the unchanged five-entry FIFO. Profiles enqueue all reports before the next profile can begin.
  timing: Cold includes job/profile capture; warm reuses captured jobs and profiles. Input transfers, execution, report drain and final raw output DMA remain timed. Keep repeated warm samples and cold results.
  gate: Run every mode with full numerical checking on the unchanged small fixture before large timing-only runs.
ownership:
  publications: Keep v001 first/skip/second addresses and all per-strip native and CGRA jobs.
  scratch: Current Activate uses CGRA words below HALO_WORDS; previous Add uses SKIP_WORD and MAIN_WORD, and writes its existing retained output.
  skip_reuse: Previous Add completion explicitly gates current Projection.
  main_reuse: Previous Add completion explicitly gates current Second; current Second also waits for current Activate publication.
  first_reuse: The preceding profile drains its Activate and Second, so the previous first publication and activation have no readers when the next profile begins.
  arbitration: Safety does not depend on First latency, root-copy priority or Add winning CGRA arbitration.
  lease_progress: At most current First is a new Gemmini publication before previous Add completes. If Activate runs first, its output retains one CGRA slot while previous Add can use the other. Its input copy releases First's Gemmini slot before Second can run.
