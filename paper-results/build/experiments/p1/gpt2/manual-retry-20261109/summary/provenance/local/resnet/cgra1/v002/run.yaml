  configuration: AutoLink, SoC and accelerator-layout loaders accepted v002. Architecture is byte-identical to v001; normalized SoC comparison confirms only run_capacity and dependency_capacity changed.
  schedule: An isolated host harness compiled the actual Auto profile builder and verified profile counts, stage and edge bounds, task coverage, cached-job bindings, graph acyclicity and both publication-reuse completion edges for two/eight strips and one/two/four CGRAs.
  reports: An isolated host harness exercised the actual Auto report drain with reversed stage-report order within every profile for the same six groupings; all passed. The harness substitutes MMIO and fixes the maximum seen-array allocation for its runtime-selected shapes.
  baselines: Manual, native Conv/CGRA submission, job capture, Hybrid profile capture/execution and output DMA function bodies match the archived v001 source.
